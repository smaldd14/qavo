<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Queue</title>
<style>.skeleton { height: 200px; background: #eee; animation: pulse 1s infinite } @keyframes pulse { 50% { opacity: .5 } }</style></head>
<body>
  <div id="root"></div>
  <script type="module">
    // Like a React app with a data query: an empty root, then a skeleton, then the data.
    const root = document.getElementById("root");
    await new Promise((resolve) => setTimeout(resolve, 50));
    root.innerHTML = '<h1>Opening balances</h1><div class="skeleton" aria-label="Loading"></div>';
    const queue = await (await fetch("/slow/queue.json")).json();
    root.innerHTML = `<header><button type="button" aria-haspopup="menu" aria-expanded="false">DS</button></header>
      <h1>Opening balances</h1><p>${queue.length} left</p><h2>${queue[0]}</h2>
      <label for="amount">Owed at takeover</label><input id="amount" value="0.00">
      <button type="button" id="save">Save and next</button>`;
    document.getElementById("save").onclick = () => {
      queue.shift();
      root.querySelector("p").textContent = `${queue.length} left`;
      root.querySelector("h2").textContent = queue[0];
    };
  </script>
</body>
</html>
